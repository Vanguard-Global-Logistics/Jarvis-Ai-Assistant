model:
  default: anthropic/claude-sonnet-5
  provider: anthropic
# Jarvis hears you locally. faster-whisper runs on this machine, needs no API
# key, and costs nothing per use — the only voice path that does not bill.
# device/compute_type are PINNED rather than left on "auto": auto picks CUDA
# whenever the ctranslate2 wheel ships CUDA libs, even on a box with no card,
# and then hard-aborts. cpu/int8 is correct for a mini-PC and never crashes.
# Verified on 2026-08-01: int8 is in get_supported_compute_types("cpu").
# NOTE: `hermes skills install` and `plugins enable` rewrite this file and
# strip comments. If this block is bare again, that is why — put it back.
stt:
  provider: local
  local:
    model: base          # ~150MB. 'small' is better on carrier names and freight
                         # jargon if the CPU can carry it — swap and re-run
                         # scripts/first-boot-stt.sh to compare on one clip.
    vad: true            # trim silence before it reaches the model
    device: cpu
    compute_type: int8
memory:
  memory_enabled: true
  user_profile_enabled: true
hooks:
  pre_tool_call:
    - command: /tmp/hermes/.venv/bin/python /root/.hermes/agent-hooks/spend_guard.py
      timeout: 10
hooks_auto_accept: true
_config_version: 33
mcp_servers:
  jarvis-brain:
    command: /tmp/hermes/.venv/bin/python
    args:
      - /tmp/jarvis/jarvis-hermes/brain-router/server.py
    enabled: true
platform_toolsets:
  cli:
    - bfl
    - browser
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - stt
    - terminal
    - todo
    - tts
    - vision
    - web
known_plugin_toolsets:
  cli:
    - spotify
known_builtin_toolsets:
  cli:
    - bfl
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - homeassistant
    - image_gen
    - memory
    - session_search
    - skills
    - spotify
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao
plugins:
  enabled:
    - platforms/telegram
  disabled: []

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
