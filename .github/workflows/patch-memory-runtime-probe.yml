name: Patch memory runtime probe

on:
  push:
    branches:
      - agent/jarvis-pro-family-brain-v1
    paths:
      - .github/workflows/patch-memory-runtime-probe.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/jarvis-pro-family-brain-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch exact runtime assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/runtime-probe.mjs')
          text = path.read_text()
          old_keys = """    'getSession',\n    'deleteSession',\n  ];"""
          new_keys = """    'getSession',\n    'deleteSession',\n    'inspectMemory',\n  ];"""
          if old_keys not in text:
              raise SystemExit('expected bridge-key block not found')
          text = text.replace(old_keys, new_keys, 1)

          anchor = """  add(\n    'getAppInfo() returns real platform info',\n    infoOk,\n    info.error ? `THREW: ${String(info.error).split('\\n')[0]}` : JSON.stringify(i),\n  );\n\n"""
          insertion = """  add(\n    'getAppInfo() returns real platform info',\n    infoOk,\n    info.error ? `THREW: ${String(info.error).split('\\n')[0]}` : JSON.stringify(i),\n  );\n\n  // Family Brain v1: prove the real Electron process owns a governed Memory v1\n  // runtime and the renderer can request only its bounded inspection projection.\n  const memoryInspection = await page.evaluate(\n    'window.jarvis ? await window.jarvis.inspectMemory() : null',\n  );\n  const memoryInspectionValue = memoryInspection.value;\n  const memoryInspectionOk =\n    memoryInspectionValue !== null &&\n    typeof memoryInspectionValue === 'object' &&\n    Array.isArray(memoryInspectionValue.items) &&\n    typeof memoryInspectionValue.truncated === 'boolean';\n  add(\n    'memory:inspect returns a bounded governed projection',\n    memoryInspectionOk,\n    memoryInspection.error\n      ? `THREW: ${String(memoryInspection.error).split('\\n')[0]}`\n      : `count = ${Array.isArray(memoryInspectionValue?.items) ? String(memoryInspectionValue.items.length) : 'invalid'}, truncated = ${String(memoryInspectionValue?.truncated)}`,\n  );\n\n"""
          if anchor not in text:
              raise SystemExit('getAppInfo assertion anchor not found')
          text = text.replace(anchor, insertion, 1)
          path.write_text(text)
          PY
          npx prettier --write scripts/runtime-probe.mjs
          git diff --check
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/patch-memory-runtime-probe.yml
          git config user.name "Jarvis Pro CI"
          git config user.email "management@vanguardgloballogisticsllc.com"
          git add scripts/runtime-probe.mjs .github/workflows/patch-memory-runtime-probe.yml
          git commit -m "test(memory): exercise inspection in real Electron runtime"
          git push origin HEAD:agent/jarvis-pro-family-brain-v1
