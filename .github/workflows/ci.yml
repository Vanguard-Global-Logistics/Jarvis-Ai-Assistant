name: CI

# Forge's five-fact model (CLAUDE.md §7): claimed ≠ committed ≠ tested ≠ previewed
# ≠ approved. This workflow produces the *tested* fact and nothing more. It does not
# approve, deploy, or merge.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Least privilege: CI reads the repo. It has no write scope and no secrets.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  runtime:
    name: Runtime probe
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # `verify` cannot see whether the application runs, and twice it did not: a build
    # that could not launch (a workspace package left external resolved to raw
    # TypeScript) and a build that rendered nothing (the CSP blocked Vite's inline
    # React Refresh preamble) were both fully green here. Both reached a human on
    # Windows before anyone noticed.
    #
    # This job launches the real Electron app — packaged path and `dev:desktop` — and
    # asserts React mounts, the bridge exposes exactly `getAppInfo`, the renderer has
    # no Node globals, and the console is clean. It is verified red-green against the
    # CSP defect specifically.
    #
    # It runs on Linux, so it is NOT the Windows acceptance gate
    # (docs/WINDOWS-ACCEPTANCE-TEST.md, ADR 0004). It closes the cheap gap — the one
    # that should never have reached a human twice — and nothing more.
    #
    # Deliberately a separate job from `verify`: it needs system libraries and a
    # virtual display, and its failures mean something different. A red `verify` says
    # the code is wrong; a red `runtime` says the code is fine and the app is broken.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # `npm ci` installs the electron package but NOT its binary: Electron 43 ships
      # no postinstall script and downloads the ~220MB executable lazily, on first
      # `require('electron')`. Doing it here rather than letting the probe trigger it
      # keeps the download visible as its own step — a network failure reports as
      # "Download the Electron binary", not as a mysteriously slow or failing probe.
      - name: Download the Electron binary
        run: node node_modules/electron/install.js

      # better-sqlite3 is compiled for the Node ABI by npm ci. Electron uses a
      # different ABI, so the real application cannot open its database until
      # the native module is rebuilt against this repository's Electron version.
      - name: Rebuild native modules for Electron
        run: npm run rebuild:electron-native

      # Electron links ~12 GUI libraries that a CI runner does not necessarily have,
      # and Chromium needs a display. Without these it dies before any of our code runs.
      - name: Install Electron's runtime libraries and Xvfb
        run: bash scripts/install-electron-runtime-deps.sh

      - name: Build
        run: npm run build

      # The probe supplies its own Xvfb (no DISPLAY here) and passes --no-sandbox,
      # which Chromium requires in a container. `webPreferences.sandbox` is untouched
      # — that is the renderer/preload sandbox and it stays on.
      - name: Probe the running app
        run: npm run probe:runtime

  handoff-integrity:
    name: Archived handoff integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # The design handoff is the behavioral contract and is immutable (CLAUDE.md §0).
    # This job fails the build if a commit modifies it, rather than relying on
    # everyone remembering the rule.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert reference/design-handoff/ is unmodified
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare against — skipping."
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}" -- reference/design-handoff/)
          if [ -n "$CHANGED" ]; then
            echo "::error::The archived design handoff is immutable, but these files changed:"
            echo "$CHANGED"
            exit 1
          fi
          echo "reference/design-handoff/ unmodified."
