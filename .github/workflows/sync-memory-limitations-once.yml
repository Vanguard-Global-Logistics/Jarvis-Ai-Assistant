name: Sync Memory Limitations Once

on:
  push:
    branches:
      - agent/jarvis-hive-local-core-2026-08-07
    paths:
      - .github/workflows/sync-memory-limitations-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/jarvis-hive-local-core-2026-08-07
      - name: Correct Memory v1 limitation status
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/KNOWN-LIMITATIONS.md')
          text = path.read_text()

          replacements = {
              'Date: 2026-07-30': 'Date: 2026-08-07',
              'Scope: the Stage 6 foundation plus the Stage 1A conversation slice (ADR 0007).': 'Scope: the Stage 6 foundation, Stage 1A conversation slice, Hive local-core branch, and Memory v1 policy foundation.',
              '**Status: persistence NOT IMPLEMENTED.**\n\nADR 0007 added a working conversation': '**Status: persistence NOT IMPLEMENTED.**\n\nMemory v1 now has an approved constitution, ADR 0009, and a tested pure domain/policy layer in `services/jarvis-core/src/memory`. It still has **no durable storage or runtime recall**: no SQLite memory migration/repository, no memory IPC surface, and no orchestration injection. Do not describe Jarvis as persistently remembering until those later gates are implemented and physically accepted.\n\nADR 0007 added a working conversation',
              '## 5. There are zero migrations\n\n**Status: NOT IMPLEMENTED, by instruction.**\n\n`migrations` in `@jarvis/database` is an empty array. No tables exist for memory,\nprojects, tasks, or the audit log. Those are feature design work and are not approved.': '## 5. There are zero migrations\n\n**Status: PARTIAL — Memory v1 policy/schema approved; persistence NOT IMPLEMENTED.**\n\n`migrations` in `@jarvis/database` is an empty array. No tables exist for memory, projects, tasks, or the audit log. Memory v1 now has an approved constitution, ADR, schema, and pure policy/tests, but its SQLite migration/repository, audit/tombstone persistence, runtime retrieval, and any IPC widening are not implemented yet.',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected source text not found: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
      - name: Commit status correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/KNOWN-LIMITATIONS.md
          git commit -m "docs(memory): correct Memory v1 limitation status"
          git push origin HEAD:agent/jarvis-hive-local-core-2026-08-07
