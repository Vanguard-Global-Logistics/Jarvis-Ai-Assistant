name: Patch memory panel into Shell

on:
  push:
    branches:
      - agent/jarvis-pro-family-brain-v1
    paths:
      - .github/workflows/patch-memory-panel-shell.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/jarvis-pro-family-brain-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch Shell
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/desktop/src/renderer/src/experience/Shell.tsx')
          text = path.read_text()

          import_anchor = """import type { ConversationBridge } from './Conversation.js';\n"""
          import_replacement = """import type { ConversationBridge } from './Conversation.js';\nimport { MemoryPanel } from './MemoryPanel.js';\nimport type { MemoryInspectionBridge } from './MemoryPanel.js';\n\ntype ShellBridge = ConversationBridge & MemoryInspectionBridge;\n"""
          if import_anchor not in text:
              raise SystemExit('conversation bridge import anchor not found')
          text = text.replace(import_anchor, import_replacement, 1)

          bridge_anchor = """  const bridge = useMemo<ConversationBridge | null>(() => window.jarvis ?? null, []);"""
          bridge_replacement = """  const bridge = useMemo<ShellBridge | null>(() => window.jarvis ?? null, []);"""
          if bridge_anchor not in text:
              raise SystemExit('bridge type anchor not found')
          text = text.replace(bridge_anchor, bridge_replacement, 1)

          render_anchor = """          <Conversation bridge={bridge} onOrbStateChange={setOrbState} />\n"""
          render_replacement = """          <Conversation bridge={bridge} onOrbStateChange={setOrbState} />\n          <div style={{ marginTop: 8, zIndex: 1 }}>\n            <MemoryPanel bridge={bridge} />\n          </div>\n"""
          if render_anchor not in text:
              raise SystemExit('conversation render anchor not found')
          text = text.replace(render_anchor, render_replacement, 1)

          path.write_text(text)
          PY
          npx prettier --write apps/desktop/src/renderer/src/experience/Shell.tsx
          git diff --check
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/patch-memory-panel-shell.yml
          git config user.name "Jarvis Pro CI"
          git config user.email "management@vanguardgloballogisticsllc.com"
          git add apps/desktop/src/renderer/src/experience/Shell.tsx .github/workflows/patch-memory-panel-shell.yml
          git commit -m "feat(memory): mount owner-visible memory panel"
          git push origin HEAD:agent/jarvis-pro-family-brain-v1
