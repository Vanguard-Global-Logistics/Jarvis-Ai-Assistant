name: Sync Memory SQLite Once

on:
  push:
    branches:
      - agent/jarvis-hive-local-core-2026-08-07
    paths:
      - .github/workflows/sync-memory-sqlite-once.yml

permissions:
  contents: write

jobs:
  sync-memory-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/jarvis-hive-local-core-2026-08-07
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize workspace lock without install scripts
        run: npm install --ignore-scripts
      - name: Apply repository Prettier
        run: npx prettier --write "packages/memory-sqlite/**/*.{ts,json}"
      - name: Commit lock and formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json packages/memory-sqlite
          git commit -m "chore(memory): sync sqlite adapter workspace"
          git push origin HEAD:agent/jarvis-hive-local-core-2026-08-07
