name: Patch memory delete runtime probe
on:
  push:
    branches: [agent/jarvis-pro-family-brain-v1]
    paths: [.github/workflows/patch-memory-delete-probe.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/jarvis-pro-family-brain-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch exact bridge expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/runtime-probe.mjs')
          s = p.read_text()
          old = "    'inspectMemory',\n  ];"
          new = "    'inspectMemory',\n    'deleteMemory',\n  ];"
          if old not in s:
              raise SystemExit('expected bridge block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/patch-memory-delete-probe.yml
          git config user.name "Jarvis Pro CI"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/runtime-probe.mjs .github/workflows/patch-memory-delete-probe.yml
          git commit -m "test(memory): include delete method in runtime probe"
          git push
