name: Format Memory Service Once

on:
  push:
    branches:
      - agent/jarvis-hive-local-core-2026-08-07
    paths:
      - .github/workflows/format-memory-service-once.yml

permissions:
  contents: write

jobs:
  format-memory-service:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/jarvis-hive-local-core-2026-08-07
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier
        run: npx prettier --write "services/jarvis-core/src/memory/{repository,service,service.test,index}.ts"
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/jarvis-core/src/memory
          git commit -m "style(memory): format service slice"
          git push origin HEAD:agent/jarvis-hive-local-core-2026-08-07
