<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jarvis</title>
    <style>
      :root {
        --field-top: #05070a; --field-bottom: #070a0f;
        --heading: #f2f8ff; --body: #dce8f0; --secondary: #aebfcd; --dim: #8fa2b3; --faint: #5f7284;
        --blue: #5ad1ff; --purple: #c9a2ff; --amber: #ffb84d; --danger: #ff5a5a; --success: #5ad18a;
        --hairline: rgba(255,255,255,0.08); --glass: rgba(255,255,255,0.03);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--body);
        background:
          radial-gradient(620px 620px at 50% 30%, rgba(90,209,255,0.05) 0%, transparent 70%),
          radial-gradient(1100px 700px at 50% 22%, rgba(80,140,255,0.07) 0%, transparent 60%),
          linear-gradient(180deg, var(--field-top) 0%, var(--field-bottom) 100%);
        min-height: 100%;
      }
      .mono { font-family: "IBM Plex Mono", "Consolas", ui-monospace, monospace; }
      #intro { position: fixed; inset: 0; z-index: 50; background: #000; display: flex; align-items: center; justify-content: center; transition: opacity 700ms ease; opacity: 1; }
      #intro.gone { opacity: 0; pointer-events: none; }
      #intro video { width: 100%; height: 100%; object-fit: cover; }
      #skip { position: absolute; bottom: 22px; right: 22px; z-index: 51; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); background: rgba(5,7,10,0.6); border: 1px solid var(--hairline); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
      #skip:hover { color: var(--blue); border-color: var(--blue); }
      #replay { position: absolute; top: 16px; right: 16px; z-index: 3; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); background: transparent; border: 1px solid var(--hairline); border-radius: 6px; padding: 5px 9px; cursor: pointer; }
      #replay:hover { color: var(--purple); border-color: var(--purple); }
      #app { min-height: 100%; display: flex; flex-direction: column; align-items: center; opacity: 0; transition: opacity 700ms ease; }
      #app.show { opacity: 1; }
      h1 { margin: 22px 0 2px; font-size: 22px; font-weight: 700; letter-spacing: 0.42em; text-transform: uppercase; color: var(--heading); padding-left: 0.42em; }
      .tag { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); border: 1px solid var(--hairline); border-radius: 4px; padding: 2px 7px; }
      .head { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .headrow { display: flex; align-items: center; gap: 10px; }
      .orb-wrap { margin: 10px 0 2px; }
      .orb { position: relative; width: 132px; height: 132px; border-radius: 50%; background: radial-gradient(circle at 42% 38%, #eaf7ff 0%, #6fd3ff 18%, #2b8fd6 42%, #0b2f52 72%, #05121f 100%); box-shadow: 0 0 40px 6px rgba(90,209,255,0.35), inset -8px -10px 26px rgba(0,0,0,0.55), inset 6px 8px 22px rgba(180,235,255,0.35); animation: breathe 5.2s ease-in-out infinite; }
      .orb::before { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 1px solid rgba(90,209,255,0.18); animation: haloSpin 14s linear infinite; }
      .orb::after { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.6), transparent 45%); opacity: 0.5; }
      @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); box-shadow: 0 0 58px 10px rgba(90,209,255,0.5), inset -8px -10px 26px rgba(0,0,0,0.55), inset 6px 8px 22px rgba(180,235,255,0.45); } }
      @keyframes haloSpin { to { transform: rotate(360deg); } }
      .orb.thinking { animation: breathe 1.6s ease-in-out infinite; background: radial-gradient(circle at 42% 38%, #eafcff 0%, #7fe6ff 20%, #22a7c9 46%, #0b3450 74%, #05121f 100%); }
      .orb.thinking::before { animation: haloSpin 2.6s linear infinite; border-color: rgba(90,209,255,0.5); }
      .orb.reasoning { background: radial-gradient(circle at 42% 38%, #f3ecff 0%, #c9a2ff 22%, #7d5bd6 48%, #2b1d55 76%, #0a0620 100%); box-shadow: 0 0 52px 8px rgba(201,162,255,0.45), inset -8px -10px 26px rgba(0,0,0,0.55), inset 6px 8px 22px rgba(230,215,255,0.4); }
      .orb.reasoning::before { animation: haloSpin 3.4s linear infinite; border-color: rgba(201,162,255,0.5); }
      .orb.speaking { animation: breathe 2.1s ease-in-out infinite; box-shadow: 0 0 66px 12px rgba(90,209,255,0.6), inset -8px -10px 26px rgba(0,0,0,0.55), inset 6px 8px 22px rgba(180,235,255,0.5); }
      .orb.listening { animation: breathe 1.3s ease-in-out infinite; background: radial-gradient(circle at 42% 38%, #eafffb 0%, #7fffe6 20%, #22c9a7 46%, #0b5040 74%, #05121f 100%); box-shadow: 0 0 60px 10px rgba(90,255,209,0.5), inset -8px -10px 26px rgba(0,0,0,0.55), inset 6px 8px 22px rgba(180,255,235,0.45); }
      .iconbtn { width: 40px; min-height: 40px; border-radius: 10px; border: 1px solid var(--hairline); background: transparent; color: var(--secondary); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
      .iconbtn:hover { border-color: var(--blue); color: var(--blue); }
      .iconbtn.on { color: var(--field-top); background: var(--blue); border-color: var(--blue); }
      .iconbtn.listening { color: var(--field-top); background: var(--success); border-color: var(--success); animation: micpulse 1.1s ease-in-out infinite; }
      @keyframes micpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(90,209,138,0.5); } 50% { box-shadow: 0 0 0 6px rgba(90,209,138,0); } }
      .banner { margin: 12px 0 8px; font-size: 10px; letter-spacing: 0.14em; color: var(--faint); text-transform: uppercase; text-align: center; padding: 0 16px; }
      .stage { flex: 1; width: 100%; max-width: 760px; display: flex; flex-direction: column; min-height: 0; padding: 0 16px; }
      .transcript { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 6px 2px; min-height: 240px; }
      .empty { margin: auto; max-width: 460px; text-align: center; color: var(--dim); font-size: 14px; line-height: 1.6; }
      .empty b { color: var(--purple); font-weight: 600; }
      .row { display: flex; flex-direction: column; gap: 4px; max-width: 82%; }
      .row.you { align-self: flex-end; align-items: flex-end; }
      .row.jarvis { align-self: flex-start; align-items: flex-start; }
      .who { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); display: flex; gap: 6px; align-items: center; }
      .chip { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; border-radius: 4px; padding: 1px 5px; }
      .chip.mock { color: var(--amber); border: 1px solid var(--amber); }
      .chip.live { color: var(--success); border: 1px solid var(--success); }
      .bubble { border-radius: 12px; border: 1px solid var(--hairline); padding: 10px 13px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; color: var(--body); }
      .row.you .bubble { background: rgba(90,209,255,0.06); }
      .row.jarvis .bubble { background: var(--glass); border-left: 2px solid var(--blue); }
      .err { align-self: flex-start; max-width: 82%; border-radius: 12px; border: 1px solid var(--danger); background: rgba(255,90,90,0.06); padding: 9px 12px; color: var(--danger); font-family: "IBM Plex Mono", Consolas, monospace; font-size: 12px; }
      .thinking-line { align-self: flex-start; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--blue); padding: 4px 2px; }
      .card { align-self: stretch; border: 1px solid var(--hairline); border-left: 2px solid var(--purple); border-radius: 14px; padding: 16px; background: rgba(8,12,18,0.55); display: flex; flex-direction: column; gap: 12px; }
      .card .lab { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
      .card .lab.p { color: var(--purple); }
      .card .idea { color: var(--dim); font-size: 13px; }
      .card .val { color: var(--body); font-size: 14px; line-height: 1.6; }
      .card ul { margin: 0; padding-left: 18px; }
      .card li { color: var(--body); font-size: 14px; line-height: 1.6; margin-bottom: 2px; }
      .card .prompt { font-family: "IBM Plex Mono", Consolas, ui-monospace, monospace; font-size: 12.5px; white-space: pre-wrap; }
      .copy { align-self: flex-start; margin-top: 2px; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--purple); background: transparent; border: 1px solid var(--purple); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
      .copy.done { color: var(--field-top); background: var(--purple); }
      .composer { display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--hairline); border-radius: 12px; background: var(--glass); padding: 8px; margin: 6px 0 10px; }
      textarea { flex: 1; resize: none; max-height: 160px; min-height: 24px; background: transparent; border: none; outline: none; color: var(--body); font-family: inherit; font-size: 14px; line-height: 1.5; padding: 6px; }
      .btn { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; border-radius: 8px; padding: 8px 14px; min-height: 36px; cursor: pointer; background: transparent; }
      .btn:disabled { cursor: default; opacity: 0.5; }
      .btn.amp { color: var(--purple); border: 1px solid var(--purple); }
      .btn.send { color: var(--field-top); background: var(--blue); border: 1px solid var(--blue); }
      footer { width: 100%; text-align: center; padding: 10px 16px 16px; font-size: 10px; letter-spacing: 0.12em; color: var(--faint); text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="intro">
      <video id="introVideo" muted playsinline autoplay preload="auto">
        <source src="./jarvis-intro.mp4" type="video/mp4" />
      </video>
      <button id="skip" class="mono">Skip intro ▸</button>
    </div>

    <div id="app">
      <button id="replay" class="mono" title="Replay the intro">↻ Intro</button>
      <div class="head">
        <div class="headrow">
          <h1>Jarvis</h1>
          <span class="tag mono" id="modeTag">Connecting…</span>
        </div>
        <div class="orb-wrap"><div class="orb" id="orb"></div></div>
      </div>
      <div class="banner mono">Conversation + Thought Amplifier · This session is not saved yet</div>
      <div class="stage">
        <div class="transcript" id="transcript">
          <div class="empty" id="empty">Ask Jarvis anything, or type a rough idea and press <b>Amplify</b> to sharpen it into a plan.</div>
        </div>
        <div class="composer">
          <button class="iconbtn" id="mic" title="Talk to Jarvis (hold or click, then speak)" aria-label="Speak to Jarvis">🎤</button>
          <button class="iconbtn on" id="voice" title="Jarvis speaks replies aloud (toggle)" aria-label="Toggle Jarvis voice">🔊</button>
          <textarea id="draft" rows="1" placeholder="Message Jarvis, or tap the mic and speak…" aria-label="Message Jarvis"></textarea>
          <button class="btn amp mono" id="amp" disabled>Amplify</button>
          <button class="btn send mono" id="send" disabled>Send</button>
        </div>
      </div>
      <footer class="mono" id="footer">Jarvis web · 🎤 talk with the mic · 🔊 Jarvis speaks back · Your key stays on the server, never in this page</footer>
    </div>

    <script>
      (function () {
        var intro = document.getElementById('intro'), video = document.getElementById('introVideo');
        var app = document.getElementById('app'), skip = document.getElementById('skip'), replay = document.getElementById('replay');
        var handed = false;
        function toApp() { if (handed) return; handed = true; intro.classList.add('gone'); app.classList.add('show'); setTimeout(function(){ intro.style.display='none'; }, 750); }
        video.addEventListener('ended', toApp);
        setTimeout(function(){ if (!handed) toApp(); }, 9500);
        var pp = video.play && video.play(); if (pp && pp.catch) pp.catch(function(){});
        skip.addEventListener('click', toApp);
        replay.addEventListener('click', function(){ handed=false; intro.style.display='flex'; intro.classList.remove('gone'); app.classList.remove('show'); try { video.currentTime=0; var q=video.play(); if (q&&q.catch) q.catch(function(){}); } catch(e){} });

        var orb = document.getElementById('orb'), transcript = document.getElementById('transcript'), empty = document.getElementById('empty');
        var draft = document.getElementById('draft'), sendBtn = document.getElementById('send'), ampBtn = document.getElementById('amp');
        var modeTag = document.getElementById('modeTag');
        var items = []; // {role, content}
        var busy = false;
        function setOrb(s){ orb.className = 'orb' + (s && s !== 'idle' ? ' ' + s : ''); }
        function refresh(){ var has = draft.value.trim().length>0 && !busy; sendBtn.disabled=!has; ampBtn.disabled=!has; }
        function scroll(){ transcript.scrollTop = transcript.scrollHeight; }
        function clearEmpty(){ if (empty && empty.parentNode) empty.remove(); }
        function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        function addMessage(who, text, provider){
          clearEmpty();
          var row = document.createElement('div'); row.className='row '+(who==='you'?'you':'jarvis');
          var label = document.createElement('div'); label.className='who mono'; label.textContent = who==='you'?'You':'Jarvis';
          if (provider === 'mock') { var c=document.createElement('span'); c.className='chip mock'; c.textContent='Mock provider'; label.appendChild(c); }
          if (provider === 'anthropic') { var l=document.createElement('span'); l.className='chip live'; l.textContent='Live'; label.appendChild(l); }
          var b = document.createElement('div'); b.className='bubble'; b.textContent=text;
          row.appendChild(label); row.appendChild(b); transcript.appendChild(row); scroll();
        }
        function addError(text){ clearEmpty(); var d=document.createElement('div'); d.className='err'; d.setAttribute('role','alert'); d.textContent=text; transcript.appendChild(d); scroll(); }
        function addThinking(t){ clearEmpty(); var d=document.createElement('div'); d.className='thinking-line mono'; d.textContent=t; transcript.appendChild(d); scroll(); return d; }
        function field(label, val){ return '<div><div class="lab mono">'+label+'</div><div class="val">'+val+'</div></div>'; }
        function addCard(r){
          clearEmpty();
          var card=document.createElement('div'); card.className='card';
          var qs = (r.missingQuestions||[]).map(function(q){ return '<li>'+esc(q)+'</li>'; }).join('');
          card.innerHTML =
            '<div><div class="lab p mono">Thought Amplifier v1</div><div class="idea">'+esc(r.__idea||'')+'</div></div>'+
            field('Clarified intent', esc(r.clarifiedIntent))+
            '<div><div class="lab mono">Missing questions</div><ul>'+qs+'</ul></div>'+
            field('Improved concept', esc(r.improvedConcept))+
            field('Recommended next step', esc(r.recommendedNextStep))+
            '<div><div class="lab mono">Build-ready prompt</div><div class="val prompt">'+esc(r.buildReadyPrompt)+'</div><button class="copy mono">Copy prompt</button></div>';
          transcript.appendChild(card);
          var cb=card.querySelector('.copy');
          cb.addEventListener('click', function(){ try { navigator.clipboard && navigator.clipboard.writeText(r.buildReadyPrompt); } catch(e){} cb.textContent='Copied'; cb.classList.add('done'); setTimeout(function(){ cb.textContent='Copy prompt'; cb.classList.remove('done'); }, 1500); });
          scroll();
        }

        function api(path, payload){
          return fetch(path, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(payload) })
            .then(function(r){ return r.json(); });
        }

        function send(){
          var text = draft.value.trim(); if (!text || busy) return;
          items.push({ role:'user', content:text }); addMessage('you', text);
          draft.value=''; busy=true; refresh(); setOrb('thinking');
          var t = addThinking('Jarvis is thinking…');
          api('/api/chat', { messages: items }).then(function(res){
            t.remove();
            if (res && res.provider === 'error') { addError(res.text || 'Jarvis could not respond.'); setOrb('warning'); setTimeout(function(){ setOrb('idle'); }, 1200); busy=false; refresh(); return; }
            var text2 = res && res.text ? res.text : '(no reply)'; items.push({ role:'assistant', content:text2 }); addMessage('jarvis', text2, res && res.provider);
            if (res && res.provider==='anthropic') modeTag.textContent='Live · '+(res.model||'model');
            if (voiceOn) { speak(text2); } else { setOrb('speaking'); setTimeout(function(){ setOrb('idle'); }, 900); }
            busy=false; refresh();
          }).catch(function(){ t.remove(); addError('Could not reach the server. Is the page deployed?'); setOrb('warning'); setTimeout(function(){ setOrb('idle'); }, 1200); busy=false; refresh(); });
        }

        function amplify(){
          var idea = draft.value.trim(); if (!idea || busy) return;
          draft.value=''; busy=true; refresh(); setOrb('reasoning');
          var t = addThinking('Jarvis is amplifying…');
          api('/api/amplify', { idea: idea }).then(function(res){
            t.remove();
            if (!res || res.error) { addError((res && res.error) || 'The amplifier could not run.'); setOrb('warning'); }
            else { res.__idea = idea; addCard(res); setOrb('success'); if (res.provider==='anthropic') modeTag.textContent='Live · '+(res.model||'model'); }
            setTimeout(function(){ setOrb('idle'); }, 800); busy=false; refresh();
          }).catch(function(){ t.remove(); addError('Could not reach the server.'); setOrb('warning'); setTimeout(function(){ setOrb('idle'); }, 1200); busy=false; refresh(); });
        }

        draft.addEventListener('input', refresh);
        draft.addEventListener('keydown', function(e){ if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
        sendBtn.addEventListener('click', send); ampBtn.addEventListener('click', amplify);
        setOrb('idle'); refresh();

        // ---- Voice: speak replies (TTS) + listen (STT). Both browser-native, $0. ----
        var voiceBtn = document.getElementById('voice'), micBtn = document.getElementById('mic');
        var voiceOn = true;
        var synth = window.speechSynthesis || null, pickedVoice = null;
        function pickVoice(){
          if (!synth) return;
          var vs = synth.getVoices() || [];
          pickedVoice = vs.find(function(v){ return /^en/i.test(v.lang) && /(male|daniel|david|guy|george|arthur|ryan)/i.test(v.name); })
            || vs.find(function(v){ return /^en/i.test(v.lang); }) || vs[0] || null;
        }
        if (synth) { pickVoice(); try { synth.onvoiceschanged = pickVoice; } catch(e){} }
        function speak(text){
          if (!synth) { setOrb('speaking'); setTimeout(function(){ setOrb('idle'); }, 900); return; }
          try { synth.cancel(); } catch(e){}
          var u = new SpeechSynthesisUtterance(String(text).slice(0, 700));
          if (pickedVoice) u.voice = pickedVoice;
          u.rate = 1.02; u.pitch = 0.95;
          u.onstart = function(){ setOrb('speaking'); };
          u.onend = function(){ setOrb('idle'); };
          u.onerror = function(){ setOrb('idle'); };
          try { synth.speak(u); } catch(e){ setOrb('idle'); }
        }
        if (!synth) { voiceBtn.disabled = true; voiceBtn.classList.remove('on'); voiceBtn.title = 'This browser has no speech output'; }
        voiceBtn.addEventListener('click', function(){
          voiceOn = !voiceOn; voiceBtn.classList.toggle('on', voiceOn); voiceBtn.textContent = voiceOn ? '🔊' : '🔇';
          if (!voiceOn && synth) { try { synth.cancel(); } catch(e){} setOrb('idle'); }
        });

        var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
        var rec = null, listening = false;
        if (!SR) { micBtn.disabled = true; micBtn.title = 'Speech input needs Chrome or Edge'; }
        else {
          rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
          rec.onstart = function(){ listening = true; micBtn.classList.add('listening'); setOrb('listening'); };
          rec.onresult = function(e){
            var interim = '', fin = '';
            for (var i = e.resultIndex; i < e.results.length; i++) {
              var t = e.results[i][0].transcript;
              if (e.results[i].isFinal) fin += t; else interim += t;
            }
            draft.value = (fin || interim); refresh();
          };
          rec.onerror = function(ev){ stopListening(); if (ev && ev.error === 'not-allowed') addError('Microphone permission was blocked. Click the padlock in the address bar and allow the mic to talk to Jarvis.'); };
          rec.onend = function(){
            micBtn.classList.remove('listening'); listening = false;
            if (orb.className.indexOf('listening') !== -1) setOrb('idle');
            if (draft.value.trim()) send(); // auto-send what you spoke
          };
        }
        function stopListening(){ try { rec && rec.stop(); } catch(e){} micBtn.classList.remove('listening'); listening = false; }
        micBtn.addEventListener('click', function(){
          if (!SR) return;
          if (listening) { stopListening(); return; }
          try { if (synth) synth.cancel(); } catch(e){}
          draft.value = '';
          try { rec.start(); } catch(e){}
        });

        // Free status check — reports whether a key is set WITHOUT calling the
        // model, so opening the page never costs anything.
        fetch('/api/status').then(function(r){ return r.json(); }).then(function(res){
          modeTag.textContent = res && res.mode === 'live' ? 'Live AI' : 'Mock — no key set';
        }).catch(function(){ modeTag.textContent = 'Ready'; });
      })();
    </script>
  </body>
</html>
